<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kontoret</title>
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#0d1015;color:#8b94a5;font-family:Roboto,system-ui,sans-serif;font-size:18px}</style>
</head>
<body>
<div id="msg">Laddar dashboard…</div>
<script>
/* Startfil för Fully Kiosk. Hämtar senaste dashboarden från GitHub.
   Utan nät visas senast hämtade version. */
var SRC = 'https://raw.githubusercontent.com/agostic85/hall-dashboard/main/pc-dashboard.html';
function show(h){ document.open(); document.write(h); document.close(); }
function cached(){ try{ return localStorage.getItem('pcDash.cache'); }catch(e){ return null; } }
try{ localStorage.setItem('pcDash.src', SRC); }catch(e){}
fetch(SRC + '?t=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
  .then(function(h){ if(h.indexOf('</html>') < 0) throw new Error('ofullständig fil'); try{ localStorage.setItem('pcDash.cache', h); }catch(e){} show(h); })
  .catch(function(e){
    var h = cached();
    if(h){ show(h); return; }
    document.getElementById('msg').textContent = 'Kunde inte hämta dashboarden (' + e.message + '). Försöker igen om 30 sekunder…';
    setTimeout(function(){ location.reload(); }, 30000);
  });
</script>
</body>
</html>
