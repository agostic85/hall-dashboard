<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d1015">
<title>Kontoret</title>
<style>
:root{
  --bg:#0d1015; --card:#161a21; --card2:#1c212a; --line:#262c37;
  --text:#eef1f6; --muted:#8b94a5; --faint:#5b6475;
  --warm:#f6b84b; --warm2:#ff9f43; --good:#3ecf8e; --warn:#f6b84b; --bad:#ff6b6b; --blue:#5aa9ff; --violet:#a78bfa;
  --r:1.15rem; --gap:.8rem;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.22vw,18px)}
body{background:var(--bg);color:var(--text);font-family:"SamsungOne",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
body.night .app{filter:brightness(.55) saturate(.8)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1.25rem;height:1.25rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;display:flex;flex-direction:column;padding:1rem 1.1rem;gap:var(--gap);transition:filter .6s}
header{display:flex;align-items:center;gap:1.4rem;padding:0 .3rem}
.clock{font-size:3.4rem;font-weight:300;letter-spacing:-.03em;line-height:1}
.date{display:flex;flex-direction:column;gap:.15rem}
.date b{font-weight:600;font-size:1.1rem}
.date span{color:var(--muted);font-size:.9rem}
.alerts{flex:1;display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .8rem;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.chip.warn{color:var(--warn);border-color:#4a3a1c;background:#221c12}
.chip.bad{color:var(--bad);border-color:#4a2228;background:#231416}
.chip.ok{color:var(--good)}
.chip svg{width:1rem;height:1rem}
.status{width:.55rem;height:.55rem;border-radius:50%;background:var(--faint)}
.status.ok{background:var(--good);box-shadow:0 0 .5rem var(--good)}
.status.err{background:var(--bad)}
.status.demo{background:var(--violet)}
.iconbtn{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.55fr 1.05fr;gap:var(--gap)}
.col{display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;min-height:0;position:relative;overflow:hidden}
.card h2{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;gap:.45rem}
.card h2 svg{width:1rem;height:1rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.8rem}
.sub{color:var(--muted);font-size:.85rem}
.big{font-size:2.6rem;font-weight:300;letter-spacing:-.03em;line-height:1}
.unit{font-size:1rem;color:var(--muted);margin-left:.15rem;letter-spacing:0}

/* Weather */
.weather{background:linear-gradient(160deg,#1b2433 0%,var(--card) 70%)}
.wx-main{display:flex;align-items:flex-end;justify-content:space-between}
.wx-temp{font-size:3.6rem;font-weight:200;letter-spacing:-.04em;line-height:.9}
.wx-icon svg{width:3.2rem;height:3.2rem;stroke:var(--blue);stroke-width:1.4}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .8rem;margin-top:1rem}
.kv div{display:flex;align-items:center;gap:.45rem;font-size:.9rem}
.kv svg{width:1rem;height:1rem;color:var(--muted)}
.indoor{display:flex;gap:.6rem;margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.indoor div{flex:1}
.indoor b{display:block;font-size:1.35rem;font-weight:400}
.indoor small{color:var(--muted);font-size:.75rem}
.co2-good{color:var(--good)} .co2-ok{color:var(--warn)} .co2-bad{color:var(--bad)}

/* Modes */
.modes{display:flex;flex-direction:column}
.mode{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.98rem;width:100%;text-align:left}
.mode:last-child{border:0}
.switch{width:2.9rem;height:1.65rem;border-radius:99px;background:#2a303b;position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#c9cfda;transition:transform .25s}
.on .switch{background:var(--good)}
.on .switch::after{transform:translateX(1.25rem);background:#fff}

/* Lights */
.lights{display:flex;flex-direction:column}
.light-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:7rem;gap:.6rem}
.tile{border-radius:1rem;background:var(--card2);border:1px solid var(--line);padding:.8rem .9rem;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:background .25s,border-color .25s,transform .12s;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .ic{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:#262c37;color:var(--muted);transition:all .25s}
.tile .nm{font-weight:600;font-size:1rem;line-height:1.2}
.tile .st{color:var(--muted);font-size:.8rem;margin-top:.15rem}
.tile.on{background:linear-gradient(150deg,#3a2c14 0%,#2a2218 60%,#221d17 100%);border-color:#5a4520}
.tile.on .ic{background:var(--warm);color:#2a1d05;box-shadow:0 0 1.2rem rgba(246,184,75,.45)}
.tile.on .st{color:#e8c98c}
.tile .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--warm);opacity:.8;transition:width .3s}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.85rem;font-weight:600}
.btn:active{background:#262c37}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#06172b}
.btn.active{background:#123a2a;border-color:#1f6b4b;color:var(--good)}

/* Car */
.car{background:linear-gradient(160deg,#16243a 0%,var(--card) 65%)}
.car-row{display:flex;align-items:center;gap:1rem}
.car-hero{display:flex;justify-content:center;margin:-.4rem 0 .1rem}
.car-hero img{height:7.6rem;width:auto;max-width:100%;filter:drop-shadow(0 .6rem .8rem rgba(0,0,0,.45))}
.ring{position:relative;width:6.2rem;height:6.2rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:7}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:1.6rem;font-weight:400;line-height:1}
.ring small{display:block;color:var(--muted);font-size:.7rem;margin-top:.15rem}
.car-info{flex:1;display:flex;flex-direction:column;gap:.35rem;font-size:.9rem}
.car-info .range{font-size:1.5rem;font-weight:300}
.car-btns{display:flex;gap:.5rem;margin-top:.85rem}
.car-btns .btn{flex:1;justify-content:center}

/* Door */
.door{display:flex;align-items:center;gap:.9rem;padding:.85rem 1rem}
.lockbtn{width:3.6rem;height:3.6rem;border-radius:1rem;display:grid;place-items:center;flex:none;position:relative;transition:background .25s}
.lockbtn svg{width:1.7rem;height:1.7rem}
.lockbtn.locked{background:#123a2a;color:var(--good)}
.lockbtn.unlocked{background:#3a2c14;color:var(--warm)}
.lockbtn .prog{position:absolute;inset:-3px;border-radius:1.15rem;border:3px solid var(--warm);clip-path:inset(0 100% 0 0);transition:none}
.holding .prog{clip-path:inset(0 0 0 0);transition:clip-path 1.4s linear}
.door .txt{flex:1}
.door .txt b{font-size:1.15rem;font-weight:600;display:block}

/* Energy */
.energy .row{display:flex;align-items:flex-end;justify-content:space-between}
.spark{width:100%;height:3.2rem;margin-top:.6rem;display:block}
.spark path.l{stroke:var(--blue);stroke-width:2;fill:none}
.spark path.a{fill:url(#sg);stroke:none}
.phases{display:flex;gap:.5rem;margin-top:.55rem}
.phase{flex:1;font-size:.85rem;color:var(--muted)}
.phase i{display:block;height:.3rem;border-radius:99px;background:#262c37;margin-top:.25rem;overflow:hidden}
.phase i b{display:block;height:100%;background:var(--blue);border-radius:99px}

/* Kalender */
.cal{display:flex;flex-direction:column}
.cal-list{flex:1;min-height:0;overflow:auto;margin-top:.2rem}
.cday{padding:.5rem 0;border-bottom:1px solid var(--line)}
.cday:last-child{border:0}
.cday h3{font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.2rem}
.cday.today h3{color:var(--blue)}
.cev{display:flex;gap:.7rem;font-size:.95rem;line-height:1.35;padding:.1rem 0}
.cev .ct{flex:none;width:5.4rem;color:var(--muted);font-size:.85rem;padding-top:.08rem;font-variant-numeric:tabular-nums}
.cev .cs{flex:1;min-width:0;overflow-wrap:anywhere}
.cempty{font-size:.8rem;color:#5b6475}

/* Appliances */
.apps{margin-top:.8rem;padding-top:.7rem;border-top:1px solid var(--line)}
.app-row{padding:.38rem 0 !important}
.app-row{display:flex;align-items:center;gap:.7rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.app-row:last-child{border:0}
.app-row .ai{width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.app-row .ai svg{width:1.1rem;height:1.1rem}
.app-row .an{flex:1;font-size:.92rem}
.app-row .as{font-size:.82rem;color:var(--muted)}
.app-row.run .ai{background:#13304a;color:var(--blue)}
.app-row.run .as{color:var(--blue)}
.app-row.done .as{color:var(--good)}
.pbar{height:.25rem;border-radius:99px;background:#262c37;margin-top:.3rem;overflow:hidden}
.pbar b{display:block;height:100%;background:var(--blue)}

/* PC-vy */
main{grid-template-columns:1.05fr 1.45fr 1.1fr}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:6.2rem;gap:.6rem}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:6.2rem;gap:.6rem}
.tiles3 .nm,.tiles4 .nm{font-size:.95rem}
.curtain{display:flex;align-items:center;gap:.7rem;margin-top:.9rem;padding-top:.9rem;border-top:1px solid var(--line)}
.curtain .ai{width:2.3rem;height:2.3rem;border-radius:.7rem;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.curtain .txt{flex:1} .curtain b{font-weight:600}
.seg{display:flex;gap:.4rem}
.rbtn{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);color:var(--text)}
.rbtn:active{background:#262c37}
.rbtn.on{background:var(--blue);color:#06172b;border-color:var(--blue)}
.co2big{display:flex;align-items:baseline;gap:.4rem}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-top:.9rem}
.kpi div{background:var(--card2);border:1px solid var(--line);border-radius:.8rem;padding:.55rem .7rem}
.kpi small{display:block;color:var(--muted);font-size:.72rem}
.kpi b{font-size:1.15rem;font-weight:500}
.printer{padding:.75rem 0;border-bottom:1px solid var(--line)}
.printer:last-child{border:0}
.printer .row1{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.printer .nm{font-weight:600;font-size:1.05rem}
.printer .meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:.45rem}
.printer .pbar{height:.4rem;margin-top:.55rem}
.stat{font-size:.78rem;font-weight:600;padding:.18rem .6rem;border-radius:99px;background:#262c37;color:var(--muted)}
.stat.run{background:#13304a;color:var(--blue)} .stat.done{background:#123a2a;color:var(--good)} .stat.off{color:var(--faint)}
.spk{padding:.65rem 0;border-bottom:1px solid var(--line)} .spk:last-child{border:0}
.spk .row1{display:flex;align-items:center;gap:.5rem}
.spk .info{flex:1;min-width:0}
.spk .info b{display:block;font-size:.95rem;font-weight:600}
.spk .info span{display:block;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vol{-webkit-appearance:none;appearance:none;width:100%;height:.35rem;border-radius:99px;background:#262c37;margin-top:.7rem;outline:none;cursor:pointer}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:1.05rem;height:1.05rem;border-radius:50%;background:#fff}
/* Spotify */
.sp-now{display:flex;align-items:center;gap:.8rem}
.sp-now img,.sp-ph{width:3.8rem;height:3.8rem;border-radius:.6rem;object-fit:cover;flex:none;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.sp-now .info{flex:1;min-width:0}
.sp-now .info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-now .info span{display:block;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-prog{height:.25rem;border-radius:99px;background:#262c37;margin-top:.7rem;overflow:hidden}
.sp-prog b{display:block;height:100%;background:#1ed760}
.sp-ctl{display:flex;align-items:center;gap:.5rem;margin-top:.7rem}
.sp-ctl .vol{flex:1;margin:0 0 0 .6rem}
.rbtn.sp-play{width:2.9rem;height:2.9rem}
.rbtn.sp-play.on{background:#1ed760;border-color:#1ed760;color:#04140a}
.sp-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:.9rem}
.sp-devs{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.45rem}
.sp-dev{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem .8rem;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.84rem}
.sp-dev svg{width:1rem;height:1rem}
.sp-dev.on{background:#123a2a;border-color:#1f6b4b;color:#1ed760}
.sheet .note{font-size:.8rem;color:var(--muted);margin-top:.2rem}

/* Spotpris */
.weather{display:flex;flex-direction:column}
.weather .indoor{margin-top:auto}
.price{display:flex;flex-direction:column}
.price-top{display:flex;align-items:center;gap:1.1rem;margin-bottom:.5rem}
.price-now{flex:1}
.lvl{display:inline-block;margin-left:.5rem;padding:.2rem .6rem;border-radius:99px;font-size:.75rem;font-weight:600;vertical-align:middle;letter-spacing:0}
.lvl.low{background:#123a2a;color:var(--good)} .lvl.mid{background:#3a2c14;color:var(--warm)} .lvl.high{background:#3a1a1e;color:var(--bad)}
.pstat{display:flex;flex-direction:column;gap:.1rem;font-size:.78rem;color:var(--muted);padding-left:1rem;border-left:1px solid var(--line)}
.pstat b{font-size:1.1rem;font-weight:600}
.pstat.lo b{color:var(--good)} .pstat.hi b{color:var(--bad)}
#pchart{flex:1;min-height:6rem;position:relative}
#pchart svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;fill:initial}
#pchart text{font-size:11px;fill:var(--muted);font-family:inherit}
.pnote{font-size:.72rem;color:var(--faint);margin-top:.35rem}

/* Sheet + dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.scrim.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:1.4rem;padding:1.5rem;width:min(30rem,90vw)}
.sheet h3{font-size:1.3rem;font-weight:600;margin-bottom:.3rem}
.dim{-webkit-appearance:none;appearance:none;width:100%;height:4rem;border-radius:1rem;background:linear-gradient(90deg,#3a2c14,var(--warm));margin:1.2rem 0;outline:none}
.dim::-webkit-slider-thumb{-webkit-appearance:none;width:1.2rem;height:4.4rem;border-radius:.5rem;background:#fff;box-shadow:0 0 .6rem rgba(0,0,0,.5)}
.field{display:flex;flex-direction:column;gap:.3rem;margin:.8rem 0}
.field label{font-size:.8rem;color:var(--muted)}
.field input{font:inherit;padding:.7rem .8rem;border-radius:.7rem;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.sheet .acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.toast{position:fixed;left:50%;bottom:1.2rem;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(150%);background:#2a303b;padding:.7rem 1.1rem;border-radius:99px;font-size:.9rem;transition:transform .3s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px),(orientation:portrait){
  body{overflow:auto;height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr 1fr}
  .col-mid{grid-column:1/-1;order:-1}
  .light-grid{grid-auto-rows:7.5rem}
  html{font-size:clamp(13px,2vw,18px)}
}
@media (max-width:560px){
  main{grid-template-columns:1fr}
  .light-grid{grid-template-columns:1fr 1fr}
  .clock{font-size:2.6rem}
  .alerts{display:none}
}
</style>
</head>

    pushPower(); render(); return;
  }
  api('GET','/manager/devices/device/').then(function(devs){
    var now = Date.now();
    Object.keys(devs).forEach(function(id){
      var caps = devs[id].capabilitiesObj || {};
      var s = state[id] || (state[id] = {});
      Object.keys(caps).forEach(function(c){
        if(pending[id+'|'+c] && now - pending[id+'|'+c] < 4000) return;
        s[c] = caps[c].value;
      });
    });
    setConn('ok','Ansluten');
    pushPower(); render();
  }).catch(function(e){
    setConn('err', 'Ingen kontakt (' + (e.message||'fel') + ')');
  });
}

function setCap(id, cap, value){
  (state[id] || (state[id] = {}))[cap] = value;
  pending[id+'|'+cap] = Date.now();
  render();
  if(DEMO) return Promise.resolve();
  return api('PUT','/manager/devices/device/'+id+'/capability/'+cap, {value:value})
    .catch(function(e){ toast('Kunde inte styra enheten ('+e.message+')'); });
}

function pushPower(){
  var p = v(D.pulse,'measure_power');
  if(p==null) return;
  powerHist.push(p);
  if(powerHist.length > 360) powerHist.shift();   // ~30 min vid 5 s
}

function lightInfo(L){
  var on = 0, dimSum = 0, dimN = 0;
  L.ids.forEach(function(id){
    if(v(id,'onoff')){ on++; var d=v(id,'dim'); if(d!=null){ dimSum+=d; dimN++; } }
  });
  return {on:on, total:L.ids.length, dim: dimN ? Math.round(dimSum/dimN*100) : null};
}

function renderLights(){
  var h = '', tilesOn = 0;
  CONFIG.lights.forEach(function(L,i){
    var inf = lightInfo(L), on = inf.on>0;
    if(on) tilesOn++;
    var st = !on ? 'Släckt' : (inf.total>1 && inf.on<inf.total ? inf.on+' av '+inf.total+' tända' : (inf.dim!=null ? inf.dim+' %' : 'Tänd'));
    h += '<button class="tile'+(on?' on':'')+'" data-act="light" data-i="'+i+'">'+
           '<span class="ic">'+icon('bulb')+'</span>'+
           '<span><div class="nm">'+L.name+'</div><div class="st">'+st+'</div></span>'+
           (on && inf.dim!=null ? '<span class="bar" style="width:'+inf.dim+'%"></span>' : '')+
         '</button>';
  });
  $('lights').innerHTML = h;
  $('lightCount').textContent = tilesOn ? '· '+tilesOn+' tända' : '· allt släckt';
}

function renderEnergy(){
  var p = v(D.pulse,'measure_power'), today = v(D.pulse,'meter_power');
  var path = '', area = '';
  if(powerHist.length>1){
    var max = Math.max.apply(null,powerHist)*1.15, min = Math.min.apply(null,powerHist)*.85, n = powerHist.length;
    var pts = powerHist.map(function(y,i){ return [(i/(n-1))*100, 40 - ((y-min)/((max-min)||1))*36]; });
    path = 'M'+pts.map(function(q){return q[0].toFixed(2)+' '+q[1].toFixed(2);}).join(' L');
    area = path + ' L100 40 L0 40 Z';
  }
  var ph = ['L1','L2','L3'].map(function(k){
    var a = v(D.pulse,'measure_current.'+k)||0;
    return '<div class="phase">'+k+' · '+num(a)+' A<i><b style="width:'+Math.min(100,a/16*100)+'%"></b></i></div>';

}

var cal = null, calErr = '';
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function loadCal(){
  if(DEMO){
    var b = new Date(), f = function(n){ var d = new Date(b.getFullYear(), b.getMonth(), b.getDate()+n); return ymd(d); };
    cal = {u:'demo', ev:[{d:f(0),t:'17:00',e:'18:30',s:'Bianca fotboll',a:0},{d:f(1),t:'',e:'',s:'Sofie ledig',a:1},{d:f(1),t:'18:00',e:'19:00',s:'Benjamin innebandy',a:0},{d:f(3),t:'08:15',e:'',s:'Tandläkare',a:0},{d:f(5),t:'',e:'',s:'Födelsedag',a:1}]};
    renderCal(); return;
  }
  api('GET','/manager/logic/variable/'+CONFIG.calVar).then(function(x){
    cal = JSON.parse(x.value || '{}'); calErr = ''; renderCal();
  }).catch(function(e){ calErr = e.message; renderCal(); });
}
function renderCal(){
  var el = $('cal'); if(!el) return;
  var head = '<div class="head"><h2>'+icon('calendar')+'Veckans kalender</h2>'+(cal && cal.u && cal.u!=='demo' ? '<span class="sub">uppdaterad '+cal.u+'</span>' : '')+'</div>';
  if(!cal || !cal.ev){ el.innerHTML = head + '<div class="sub" style="margin-top:.6rem">'+(calErr ? 'Kunde inte läsa kalendern ('+esc(calErr)+')' : 'Hämtar kalender…')+'</div>'; return; }
  var t = new Date(), h = '';
  for(var i=0;i<7;i++){
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i), k = ymd(d);
    var lbl = i===0 ? 'Idag' : i===1 ? 'Imorgon' : d.toLocaleDateString('sv-SE',{weekday:'long', day:'numeric', month:'short'}).replace(/^./, function(c){ return c.toUpperCase(); });
    var evs = cal.ev.filter(function(x){ return x.d===k; });
    h += '<div class="cday'+(i===0?' today':'')+'"><h3>'+lbl+'</h3>' + (evs.length ? evs.map(function(x){
      var tm = x.a ? 'Heldag' : (x.t ? x.t + (x.e ? '–'+x.e : '') : (x.e ? 'till '+x.e : ''));
      return '<div class="cev"><span class="ct">'+tm+'</span><span class="cs">'+esc(x.s)+'</span></div>';
    }).join('') : '<div class="cempty">Inget inplanerat</div>') + '</div>';
  }
  el.innerHTML = head + '<div class="cal-list">'+h+'</div>';
}

var prices = {};
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function loadDay(d){
  var k = ymd(d);
  var url = 'https://www.elprisetjustnu.se/api/v1/prices/'+d.getFullYear()+'/'+k.slice(5)+'_'+CONFIG.priceArea+'.json';
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(a){
    prices[k] = a.map(function(x){ return {t:new Date(x.time_start).getTime(), p:x.SEK_per_kWh*100*(CONFIG.priceVat?1.25:1)}; });
    try{ localStorage.setItem('hallDash.prices', JSON.stringify(prices)); }catch(e){}
  });
}
function loadPrices(){
  var t = new Date(), m = new Date(t.getFullYear(), t.getMonth(), t.getDate()+1);
  var keep = {}; keep[ymd(t)] = 1; keep[ymd(m)] = 1;
  if(!Object.keys(prices).length){ try{ prices = JSON.parse(localStorage.getItem('hallDash.prices')||'{}'); }catch(e){} }
  Object.keys(prices).forEach(function(k){ if(!keep[k]) delete prices[k]; });
  var jobs = [];
  if(!prices[ymd(t)]) jobs.push(loadDay(t).catch(function(){}));
  if(!prices[ymd(m)]) jobs.push(loadDay(m).catch(function(){}));
  Promise.all(jobs).then(function(){
    if(!prices[ymd(t)] && DEMO){
      var s0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      prices[ymd(t)] = PRICE_DEMO.map(function(p,i){ return {t:s0+i*900000, p:p}; });
    }
    renderPrice();
  });
}
function hourly(){
  var h = {};
  Object.keys(prices).forEach(function(k){ prices[k].forEach(function(x){
    var d = new Date(x.t); d.setMinutes(0,0,0); var key = d.getTime();
    (h[key] || (h[key] = [])).push(tot(x.p));
  }); });
  return Object.keys(h).map(Number).sort(function(a,b){ return a-b; }).map(function(k){
    var a = h[k]; return {t:k, p:a.reduce(function(s,x){ return s+x; },0)/a.length};
  });
}
function tot(spot){ var T = CONFIG.tariff; return (Math.min(spot, T.cap) + T.handel + T.nat) * T.vat; }
function ore(p){ return num(p, Math.abs(p)<10?1:0); }
function hh(t){ return ('0'+new Date(t).getHours()).slice(-2); }
function span(t){
  var d = new Date(t), today = ymd(new Date());
  return (ymd(d)===today ? '' : 'imorgon ') + 'kl '+hh(t)+'–'+hh(t+3600000);
}
function renderPrice(){
  var el = $('price'); if(!el) return;
  var head = '<div class="head" style="margin-bottom:.5rem"><h2>'+icon('bolt')+'Elpris '+CONFIG.priceArea+'</h2><span class="sub">öre/kWh · totalpris inkl. nät, skatt & moms · takpris '+CONFIG.tariff.cap+' öre</span></div>';
  var H = hourly(), now = Date.now();
  if(!H.length){ el.innerHTML = head + '<div class="sub">Hämtar elpriser…</div>'; return; }
  var cur = null;
  Object.keys(prices).forEach(function(k){ prices[k].forEach(function(x){ if(x.t<=now && now<x.t+900000) cur = tot(x.p); }); });
  var hs = new Date(); hs.setMinutes(0,0,0); hs = hs.getTime();
  var fut = H.filter(function(x){ return x.t>=hs; });
  if(!fut.length) fut = H;
  var sorted = fut.map(function(x){ return x.p; }).sort(function(a,b){ return a-b; });
  var q1 = sorted[Math.floor((sorted.length-1)/3)], q2 = sorted[Math.floor((sorted.length-1)*2/3)];
  function lvl(p){ return p<=q1 ? 'low' : p<=q2 ? 'mid' : 'high'; }
  var mn = fut[0], mx = fut[0];
  fut.forEach(function(x){ if(x.p<mn.p) mn = x; if(x.p>mx.p) mx = x; });
  if(cur==null) cur = fut[0].p;
  var L = lvl(cur), LT = {low:'Billigt', mid:'Normalt', high:'Dyrt'}[L];
  var hasTomorrow = !!prices[ymd(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()+1))];
  el.innerHTML = head +
    '<div class="price-top">'+
      '<div class="price-now"><span class="big">'+ore(cur)+'</span><span class="unit">öre</span><span class="lvl '+L+'">'+LT+' just nu</span></div>'+
      '<div class="pstat lo">Lägst '+span(mn.t)+'<b>'+ore(mn.p)+' öre</b></div>'+
      '<div class="pstat hi">Högst '+span(mx.t)+'<b>'+ore(mx.p)+' öre</b></div>'+
    '</div>'+
    '<div id="pchart"></div>'+
    '<div class="pnote">Grönt billigast · gult normalt · rött dyrast av kommande timmar'+(hasTomorrow ? '' : ' · morgondagens priser kommer ca kl 13')+'</div>';
  drawChart(hasTomorrow ? H.filter(function(x){ return x.t >= hs-2*3600000; }) : H, hs, mn, mx, lvl);
}
function drawChart(H, hs, mn, mx, lvl){
  var box = $('pchart'); var W = box.clientWidth, Hh = box.clientHeight;
  if(!W || !Hh) return;
  var top = 16, bot = 16, ch = Hh-top-bot, n = H.length, bw = W/n, g = Math.max(1, bw*.18);
  var capP = tot(CONFIG.tariff.cap);
  var maxP = capP; H.forEach(function(x){ if(x.p>maxP) maxP = x.p; }); maxP *= 1.08;
  var col = {low:'#3ecf8e', mid:'#f6b84b', high:'#ff6b6b'};
  var s = '<svg viewBox="0 0 '+W+' '+Hh+'" width="'+W+'" height="'+Hh+'">';
  H.forEach(function(x,i){
    var bh = Math.max(2, Math.max(0,x.p)/maxP*ch), xx = i*bw+g/2, yy = top+ch-bh, past = x.t<hs, isCur = x.t===hs;
    var f = past ? '#2a303b' : col[lvl(x.p)];
    s += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+(bw-g).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+f+'" fill-opacity="'+(past?1:(isCur?1:.75))+'"'+(isCur?' stroke="#fff" stroke-width="1.5"':'')+'/>';
    var hr = new Date(x.t).getHours();
    if(hr===0 && i>0){
      s += '<line x1="'+(i*bw).toFixed(1)+'" y1="4" x2="'+(i*bw).toFixed(1)+'" y2="'+(top+ch)+'" stroke="#5b6475" stroke-dasharray="3 3"/>';
      s += '<text x="'+(i*bw+4).toFixed(1)+'" y="11">imorgon</text>';
    }
    if(isCur) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(Hh-3)+'" text-anchor="middle" style="fill:#eef1f6;font-weight:600">nu</text>';
    else if(hr%3===0) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(Hh-3)+'" text-anchor="middle">'+('0'+hr).slice(-2)+'</text>';
    if(x===mn || x===mx) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" style="fill:'+(x===mn?'#3ecf8e':'#ff6b6b')+';font-weight:600">'+ore(x.p)+'</text>';
  });
  var cy = (top+ch-capP/maxP*ch).toFixed(1);
  s += '<line x1="0" y1="'+cy+'" x2="'+W+'" y2="'+cy+'" stroke="#eef1f6" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="6 4"/>';
  s += '<text x="'+(W-2)+'" y="'+(cy-5)+'" text-anchor="end" style="fill:#eef1f6;opacity:.75">Takpris ('+CONFIG.tariff.cap+' öre spot) = '+ore(capP)+' öre</text>';
  box.innerHTML = s + '</svg>';
}

/* ===================== Spotify ===================== */
var SP_REDIRECT = 'https://agostic85.github.io/hall-dashboard/spotify.html';
var SP_SCOPES = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
var SP = (function(){ try{ return JSON.parse(localStorage.getItem('pcDash.spotify')||'{}'); }catch(e){ return {}; } })();
var spState = null, spDevs = [], spErr = '';
function saveSp(){ try{ localStorage.setItem('pcDash.spotify', JSON.stringify(SP)); }catch(e){} }
function b64url(buf){ var a = new Uint8Array(buf), s = ''; for(var i=0;i<a.length;i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function rnd(n){ var a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0,n); }
function spLogin(){
  var cid = $('spCid').value.trim(); if(!cid){ toast('Fyll i Client ID först'); return; }
  SP.clientId = cid; SP.ver = rnd(64); SP.state = rnd(16); saveSp();
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(SP.ver)).then(function(h){
    var url = 'https://accounts.spotify.com/authorize?response_type=code&client_id='+encodeURIComponent(cid)+
      '&scope='+encodeURIComponent(SP_SCOPES)+'&redirect_uri='+encodeURIComponent(SP_REDIRECT)+
      '&code_challenge_method=S256&code_challenge='+b64url(h)+'&state='+SP.state;
    window.open(url, 'spotifyLogin', 'width=520,height=760');
  });
}
function spToken(params){
  params.client_id = SP.clientId;
  return fetch('https://accounts.spotify.com/api/token', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(params)})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.error||('HTTP '+r.status)); return j; }); })
    .then(function(j){ SP.access = j.access_token; SP.exp = Date.now()+j.expires_in*1000; if(j.refresh_token) SP.refresh = j.refresh_token; saveSp(); });
}
function spFinish(code){
  code = String(code||'').trim(); var m = code.match(/[?&]code=([^&]+)/); if(m) code = decodeURIComponent(m[1]);
  if(!code){ toast('Klistra in koden först'); return; }
  spToken({grant_type:'authorization_code', code:code, redirect_uri:SP_REDIRECT, code_verifier:SP.ver})
    .then(function(){ delete SP.ver; delete SP.state; saveSp(); $('spScrim').classList.remove('show'); toast('Spotify är anslutet'); spPoll(); spDevices(); })
    .catch(function(e){ toast('Spotify: '+e.message); });
}
function spAuth(){
  if(!SP.refresh) return Promise.reject(new Error('Inte ansluten'));
  if(SP.access && Date.now() < SP.exp-60000) return Promise.resolve();
  return spToken({grant_type:'refresh_token', refresh_token:SP.refresh});
}
function spApi(method, path, body){
  return spAuth().then(function(){
    return fetch('https://api.spotify.com/v1'+path, {method:method, headers:{'Authorization':'Bearer '+SP.access, 'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  }).then(function(r){
    if(r.status===204 || r.status===202) return null;
    return r.text().then(function(t){ var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){} if(!r.ok) throw new Error((j&&j.error&&j.error.message)||('HTTP '+r.status)); return j; });
  });
}
function spPoll(){ if(!SP.refresh){ renderSpotify(); return; } spApi('GET','/me/player').then(function(j){ spState = j; spErr = ''; renderSpotify(); }).catch(function(e){ spErr = e.message; renderSpotify(); }); }
function spDevices(){ if(!SP.refresh) return; spApi('GET','/me/player/devices').then(function(j){ spDevs = (j&&j.devices)||[]; renderSpotify(); }).catch(function(){}); }
function spCmd(method, path, body){ spApi(method, path, body).then(function(){ setTimeout(spPoll,500); setTimeout(spDevices,900); }).catch(function(e){ toast('Spotify: '+e.message); }); }
function devIcon(t){ t = String(t||'').toLowerCase(); return t==='computer' ? 'pc' : t==='smartphone' ? 'phone' : (t==='tv'||t==='castvideo') ? 'tv' : 'speaker'; }
window.addEventListener('message', function(e){ var d = e.data; if(d && d.type==='spotify-code' && SP.state && d.state===SP.state) spFinish(d.code); });
document.addEventListener('change', function(e){ if(e.target.id==='spVol'){ spCmd('PUT','/me/player/volume?volume_percent='+e.target.value); e.target.blur(); } });
function renderSpotify(){
  var el = $('spotify'); if(!el) return;
  var ae = document.activeElement; if(ae && ae.id==='spVol') return;
  var head = '<div class="head" style="margin-bottom:.6rem"><h2>'+icon('music')+'Spotify</h2>'+(SP.refresh ? '<button class="rbtn" data-act="spsetup" title="Inställningar" style="width:2rem;height:2rem">'+icon('gear')+'</button>' : '')+'</div>';
  if(!SP.refresh){
    el.innerHTML = head+'<div class="sub" style="margin-bottom:.9rem">Styr Spotify och välj var musiken ska spelas.</div><button class="btn primary" data-act="spsetup">Anslut Spotify</button>';
    return;
  }
  var s = spState, it = s && s.item, dev = s && s.device, playing = !!(s && s.is_playing);
  var imgs = it && it.album && it.album.images || [], img = imgs.length ? imgs[Math.min(1, imgs.length-1)].url : '';
  var pct = it && it.duration_ms ? Math.min(100, (s.progress_ms||0)/it.duration_ms*100) : 0;
  var vol = dev && dev.volume_percent!=null ? dev.volume_percent : 50, canVol = !!dev && dev.supports_volume!==false;
  var h = head+
    '<div class="sp-now">'+(img ? '<img src="'+esc(img)+'" alt="">' : '<div class="sp-ph">'+icon('music')+'</div>')+
    '<div class="info"><b>'+(it ? esc(it.name) : 'Inget spelas')+'</b><span>'+(it ? esc((it.artists||[]).map(function(a){ return a.name; }).join(', ')) : (spErr ? 'Fel: '+esc(spErr) : 'Välj en enhet nedan'))+'</span>'+
    (dev ? '<span style="color:#1ed760">'+icon(devIcon(dev.type)).replace('<svg>','<svg style="width:.85rem;height:.85rem;vertical-align:-2px">')+' '+esc(dev.name)+'</span>' : '')+'</div></div>'+
    '<div class="sp-prog"><b style="width:'+pct+'%"></b></div>'+
    '<div class="sp-ctl"><button class="rbtn" data-act="spprev">'+icon('prev')+'</button>'+
    '<button class="rbtn sp-play'+(playing?' on':'')+'" data-act="spplay">'+icon(playing?'pause':'play')+'</button>'+
    '<button class="rbtn" data-act="spnext">'+icon('next')+'</button>'+
    '<input type="range" class="vol" id="spVol" min="0" max="100" value="'+vol+'"'+(canVol?'':' disabled')+' title="Volym"></div>'+
    '<div class="sp-lbl">Spela på</div><div class="sp-devs">'+
    (spDevs.length ? spDevs.map(function(d){ return '<button class="sp-dev'+(d.is_active?' on':'')+'" data-act="spdev" data-id="'+esc(d.id)+'">'+icon(devIcon(d.type))+'<span>'+esc(d.name)+'</span></button>'; }).join('') : '<div class="sub">Inga enheter hittades. Öppna Spotify på en enhet så dyker den upp.</div>')+
    '<button class="sp-dev" data-act="sprefresh" title="Uppdatera listan">↻</button></div>';
  el.innerHTML = h;
}

/* ===================== Interaktion ===================== */
var dimIdx = null, pressTimer = null, longFired = false, unlockTimer = null;

function toggleLight(i){
  var L = CONFIG.lights[i], anyOn = lightInfo(L).on > 0;
  L.ids.forEach(function(id){ setCap(id,'onoff',!anyOn); });
}
function openDim(i){
  dimIdx = i; $('dimTitle').textContent = CONFIG.lights[i].name; syncDim();
  $('dimScrim').classList.add('show');
}
function syncDim(){
  var inf = lightInfo(CONFIG.lights[dimIdx]);
  var d = inf.dim!=null ? inf.dim : Math.round((v(CONFIG.lights[dimIdx].ids[0],'dim')||1)*100);
  if(document.activeElement !== $('dimRange')) $('dimRange').value = d;
  $('dimVal').textContent = inf.on ? d+' %' : 'Släckt';
}
$('dimRange').addEventListener('input', function(){ $('dimVal').textContent = this.value+' %'; });
$('dimRange').addEventListener('change', function(){
  var val = this.value/100;
  CONFIG.lights[dimIdx].ids.forEach(function(id){ setCap(id,'dim',val); if(!v(id,'onoff')) setCap(id,'onoff',true); });
});

document.addEventListener('pointerdown', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  longFired = false;
  if(t.dataset.act==='light'){
    pressTimer = setTimeout(function(){ longFired = true; openDim(+t.dataset.i); }, 550);
  }
  if(t.dataset.act==='lock' && v(D.door,'locked')){
    holding = true; t.parentNode.classList.add('holding');
    unlockTimer = setTimeout(function(){
      longFired = true; holding = false;
      setCap(D.door,'locked',false); toast('Ytterdörren låses upp');
    }, 1400);
  }
});
function cancelPress(){
  clearTimeout(pressTimer);
  if(unlockTimer){ clearTimeout(unlockTimer); unlockTimer=null; }
  if(holding){ holding=false; $('door').classList.remove('holding'); renderDoor(); }
}
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  if(longFired){ longFired=false; return; }
  var act = t.dataset.act;
  switch(act){
    case 'light': toggleLight(+t.dataset.i); break;
    case 'alloff':
      CONFIG.lights.forEach(function(L){ if(t.dataset.g && L.group!==t.dataset.g) return; L.ids.forEach(function(id){ if(v(id,'onoff')) setCap(id,'onoff',false); }); });
      toast('Alla lampor släcks'); break;
    case 'climate': var c = !v(D.car,'climate_control'); setCap(D.car,'climate_control',c); toast(c?'Förvärmning startas':'Förvärmning stoppas'); break;
    case 'carlock': if(v(D.car,'locked')===false){ setCap(D.car,'locked',true); toast('Bilen låses'); } break;
    case 'force': setCap(D.force,'onoff',!v(D.force,'onoff')); break;
    case 'lock': if(!v(D.door,'locked')){ setCap(D.door,'locked',true); toast('Ytterdörren låses'); } else toast('Håll in för att låsa upp'); break;
    case 'dimoff': CONFIG.lights[dimIdx].ids.forEach(function(id){ setCap(id,'onoff',false); }); closeDim(); break;
    case 'curtain': setCap(D.curtain,'windowcoverings_state',t.dataset.v); break;
    case 'onoff': setCap(t.dataset.id,t.dataset.cap,!v(t.dataset.id,t.dataset.cap)); break;
    case 'spkplay': setCap(t.dataset.id,'speaker_playing',!v(t.dataset.id,'speaker_playing')); break;
    case 'spkbtn': setCap(t.dataset.id,t.dataset.cap,true); break;
    case 'spsetup': $('spRedir').value = SP_REDIRECT; $('spCid').value = SP.clientId||''; $('spCode').value = ''; $('spScrim').classList.add('show'); break;
    case 'splogin': spLogin(); break;
    case 'spfinish': spFinish($('spCode').value); break;
    case 'spclose': $('spScrim').classList.remove('show'); break;
    case 'spdisc': SP = {clientId:SP.clientId}; saveSp(); spState = null; spDevs = []; $('spScrim').classList.remove('show'); renderSpotify(); toast('Spotify frånkopplat'); break;
    case 'spplay':
      if(spState && spState.is_playing) spCmd('PUT','/me/player/pause');
      else if(spState && spState.device) spCmd('PUT','/me/player/play');
      else if(spDevs.length) spCmd('PUT','/me/player', {device_ids:[(spDevs.filter(function(d){ return d.is_active; })[0]||spDevs[0]).id], play:true});
      else toast('Ingen Spotify-enhet hittades');
      break;
    case 'spprev': spCmd('POST','/me/player/previous'); break;
    case 'spnext': spCmd('POST','/me/player/next'); break;
    case 'spdev': spCmd('PUT','/me/player', {device_ids:[t.dataset.id], play:true}); toast('Byter enhet…'); break;
    case 'sprefresh': spDevices(); spPoll(); break;
    case 'dimclose': closeDim(); break;
    case 'setclose': $('setScrim').classList.remove('show'); break;
    case 'setsave':
      saveLocal({address:$('fAddr').value.trim(), token:$('fTok').value.trim()}); location.reload(); break;
    case 'setdemo': saveLocal({}); location.reload(); break;
  }
});
function closeDim(){ $('dimScrim').classList.remove('show'); dimIdx = null; }
$('dimScrim').addEventListener('click', function(e){ if(e.target===this) closeDim(); });
$('gear').addEventListener('click', function(){
  $('fAddr').value = cfg.address; $('fTok').value = cfg.token;
  $('setScrim').classList.add('show');
});

/* ===================== Start ===================== */
if(DEMO){ setConn('demo','Demoläge'); for(var k=0;k<40;k++){ poll(); } }
else setConn('', 'Ansluter…');
renderClock(); setInterval(renderClock, 10000);
render(); poll(); setInterval(poll, CONFIG.pollMs);
spPoll(); setInterval(spPoll, 5000); spDevices(); setInterval(spDevices, 30000);

/* Automatisk uppdatering: om sidan laddats via start.html kollas GitHub var 10:e minut */
(function(){
  var src=null, cur=null;
  try{ src=localStorage.getItem('pcDash.src'); cur=localStorage.getItem('pcDash.cache'); }catch(e){}
  if(!src) return;
  setInterval(function(){
    fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(h){ if(cur && h!==cur && h.indexOf('</html>')>0){ try{localStorage.setItem('pcDash.cache',h);}catch(e){} location.reload(); } })
      .catch(function(){});
  }, 10*60*1000);
})();
