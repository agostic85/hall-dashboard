<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotify – anslut dashboard</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1015;color:#eef1f6;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.box{max-width:30rem;padding:2rem;text-align:center}
h2{margin:.2rem 0 .6rem}
p{color:#8b94a5;line-height:1.5}
code{display:block;word-break:break-all;background:#161a21;border:1px solid #262c37;border-radius:.7rem;padding:1rem;margin:1rem 0;font-size:.85rem;color:#c9cfda}
button{font:inherit;padding:.65rem 1.3rem;border-radius:99px;border:0;background:#1ed760;color:#04140a;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="box">Ansluter…</div>
<script>
var p = new URLSearchParams(location.search), code = p.get('code'), state = p.get('state'), err = p.get('error'), box = document.getElementById('box');
function txt(s){ return String(s).replace(/[<>&"]/g, ''); }
if(err){
  box.innerHTML = '<h2>Inloggningen avbröts</h2><p>Spotify svarade: ' + txt(err) + '</p>';
} else if(code){
  var sent = false;
  try{ if(window.opener){ window.opener.postMessage({type:'spotify-code', code:code, state:state}, '*'); sent = true; } }catch(e){}
  box.innerHTML = (sent
    ? '<h2>Klart!</h2><p>Fönstret stängs strax. Om dashboarden inte ansluter: kopiera koden och klistra in den i steg 4.</p>'
    : '<h2>Nästan klart</h2><p>Kopiera koden och klistra in den i dashboarden (steg 4).</p>') +
    '<code id="c"></code><button id="b">Kopiera koden</button>';
  document.getElementById('c').textContent = code;
  document.getElementById('b').onclick = function(){
    navigator.clipboard.writeText(code).then(function(){ document.getElementById('b').textContent = 'Kopierad ✓'; });
  };
  if(sent) setTimeout(function(){ window.close(); }, 4000);
} else {
  box.innerHTML = '<h2>Ingen kod</h2><p>Starta inloggningen från dashboarden.</p>';
}
</script>
</body>
</html>
