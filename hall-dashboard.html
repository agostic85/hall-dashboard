<title>Hallen</title>
<script>
/* PWA – gör sidan installerbar som app. Aktiv bara när hall-dashboard.html
   öppnas direkt via https (GitHub Pages). Påverkar inte plattan (start.html/Fully Kiosk). */
(function(){
  if (location.protocol !== 'https:' || !/hall-dashboard\.html$/.test(location.pathname)) return;
  var h = document.head;
  function add(rel, href, attrs){ var l=document.createElement('link'); l.rel=rel; l.href=href; for(var k in (attrs||{})) l.setAttribute(k, attrs[k]); h.appendChild(l); }
  add('manifest', 'manifest-hallen.webmanifest');
  add('icon', 'icon-192.png', {sizes:'192x192', type:'image/png'});
  add('apple-touch-icon', 'apple-touch-icon.png');
  var m=document.createElement('meta'); m.name='apple-mobile-web-app-capable'; m.content='yes'; h.appendChild(m);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  /* Ladda om appen automatiskt när en ny version publicerats (kollar var 15:e minut) */
  function hash(t){ var x=0; for(var i=0;i<t.length;i++){ x=((x<<5)-x+t.charCodeAt(i))|0; } return x; }
  function sig(){ return fetch(location.pathname, {cache:'no-store'}).then(function(r){ return r.text(); }).then(hash); }
  var first=null;
  sig().then(function(s){ first=s; }).catch(function(){});
  setInterval(function(){ sig().then(function(s){ if(first!==null && s!==first) location.reload(); }).catch(function(){}); }, 15*60*1000);
})();
</script>
<style>
:root{
  --bg:#0d1015; --card:#161a21; --card2:#1c212a; --line:#262c37;
  --text:#eef1f6; --muted:#8b94a5; --faint:#5b6475;
  --warm:#f6b84b; --warm2:#ff9f43; --good:#3ecf8e; --warn:#f6b84b; --bad:#ff6b6b; --blue:#5aa9ff; --violet:#a78bfa;
  --r:.9rem; --gap:.55rem;
  --disp:"Michroma","Chakra Petch",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.22vw,18px)}
body{background:var(--bg);color:var(--text);font-family:"Chakra Petch","SamsungOne",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
  height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
body.night .app{filter:brightness(.55) saturate(.8)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1.25rem;height:1.25rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;display:flex;flex-direction:column;padding:.6rem .75rem;gap:var(--gap);transition:filter .6s}
header{display:flex;align-items:center;gap:1rem;padding:0 .2rem}
.clock{font-family:var(--disp);font-size:2.2rem;font-weight:400;letter-spacing:-.02em;line-height:1}
.date{display:flex;flex-direction:column;gap:.1rem}
.date b{font-weight:600;font-size:1rem}
.date span{color:var(--muted);font-size:.82rem}
.alerts{flex:1;display:flex;gap:.4rem;justify-content:flex-end;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .65rem;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.chip.warn{color:var(--warn);border-color:#4a3a1c;background:#221c12}
.chip.bad{color:var(--bad);border-color:#4a2228;background:#231416}
.chip.ok{color:var(--good)}
.chip svg{width:1rem;height:1rem}
.status{width:.55rem;height:.55rem;border-radius:50%;background:var(--faint)}
.status.ok{background:var(--good);box-shadow:0 0 .5rem var(--good)}
.status.err{background:var(--bad)}
.status.demo{background:var(--violet)}
.iconbtn{width:2.1rem;height:2.1rem;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted)}

main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:var(--gap)}
.col{display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .85rem;min-height:0;position:relative;overflow:hidden;flex:none}
.card h2{font-family:var(--disp);font-size:.62rem;font-weight:400;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.card h2 svg{width:.95rem;height:.95rem}
.head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.sub{color:var(--muted);font-size:.8rem}
.big{font-size:2.1rem;font-weight:300;letter-spacing:-.03em;line-height:1}
.unit{font-size:.9rem;color:var(--muted);margin-left:.15rem;letter-spacing:0}
.grow{flex:1 1 0}

/* Weather */
.weather{background:linear-gradient(160deg,#1b2433 0%,var(--card) 70%)}
.wx-main{display:flex;align-items:center;gap:.9rem}
.wx-temp{font-size:2.8rem;font-weight:300;letter-spacing:-.04em;line-height:.9}
.wx-icon svg{width:1.4rem;height:1.4rem;stroke:var(--blue);stroke-width:1.6}
.kv{flex:1;display:grid;grid-template-columns:auto auto;gap:.3rem .7rem}
.kv div{display:flex;align-items:center;gap:.35rem;font-size:.85rem;white-space:nowrap}
.kv svg{width:.9rem;height:.9rem;color:var(--muted)}
.indoor{display:flex;gap:.5rem;margin-top:.6rem;padding-top:.5rem;border-top:1px solid var(--line)}
.indoor div{flex:1}
.indoor b{display:block;font-size:1.15rem;font-weight:400}
.indoor small{color:var(--muted);font-size:.75rem}
.co2-good{color:var(--good)} .co2-ok{color:var(--warn)} .co2-bad{color:var(--bad)}

/* Modes */
.modes{display:flex;flex-direction:column}
.mode{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.98rem;width:100%;text-align:left}
.mode:last-child{border:0}
.switch{width:2.9rem;height:1.65rem;border-radius:99px;background:#2a303b;position:relative;transition:background .25s}
.switch::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.25rem;height:1.25rem;border-radius:50%;background:#c9cfda;transition:transform .25s}
.on .switch{background:var(--good)}
.on .switch::after{transform:translateX(1.25rem);background:#fff}

/* Lights */
.lights{display:flex;flex-direction:column}
.light-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem}
.tile{min-height:3.3rem;border-radius:.75rem;background:var(--card2);border:1px solid var(--line);padding:.45rem .65rem;display:flex;flex-direction:column;justify-content:center;gap:.15rem;text-align:left;transition:background .25s,border-color .25s,transform .12s;position:relative;overflow:hidden}
.tile:active{transform:scale(.97)}
.tile .nm{font-weight:600;font-size:.9rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .st{color:var(--muted);font-size:.75rem;display:flex;align-items:center;gap:.3rem}
.tile .st svg{width:.85rem;height:.85rem}
.tile.on{background:linear-gradient(150deg,#3a2c14 0%,#2a2218 60%,#221d17 100%);border-color:#5a4520}
.tile.on .st{color:#e8c98c}
.tile.on .st svg{color:var(--warm);filter:drop-shadow(0 0 .3rem rgba(246,184,75,.7))}
.tile .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--warm);opacity:.8;transition:width .3s}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.32rem .7rem;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.8rem;font-weight:600}
.btn svg{width:1rem;height:1rem}
.btn:active{background:#262c37}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#06172b}
.btn.active{background:#123a2a;border-color:#1f6b4b;color:var(--good)}

/* Car */
.car{background:linear-gradient(160deg,#16243a 0%,var(--card) 65%)}
.car-row{display:flex;align-items:center;gap:1rem}
.car-hero{display:flex;justify-content:center;margin:-.3rem 0 .2rem}
.car-hero img{height:5rem;width:auto;max-width:100%;filter:drop-shadow(0 .5rem .6rem rgba(0,0,0,.45))}
.ring{position:relative;width:4.6rem;height:4.6rem;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:8}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring b{font-size:1.2rem;font-weight:400;line-height:1}
.ring small{display:block;color:var(--muted);font-size:.62rem;margin-top:.1rem}
.car-row{gap:.8rem}
.car-info{flex:1;display:flex;flex-direction:column;gap:.15rem;font-size:.85rem;min-width:0}
.car-info .range{font-size:1.25rem;font-weight:300;line-height:1.1}
.car-info .sub{font-size:.76rem}
.car-btns{display:flex;gap:.45rem;margin-top:.55rem}
.car-btns .btn{flex:1;justify-content:center}

/* Door */
.door{display:flex;align-items:center;gap:.7rem;padding:.5rem .85rem}
.lockbtn{width:2.6rem;height:2.6rem;border-radius:.7rem;display:grid;place-items:center;flex:none;position:relative;transition:background .25s}
.lockbtn svg{width:1.3rem;height:1.3rem}
.lockbtn.locked{background:#123a2a;color:var(--good)}
.lockbtn.unlocked{background:#3a2c14;color:var(--warm)}
.lockbtn .prog{position:absolute;inset:-3px;border-radius:.85rem;border:3px solid var(--warm);clip-path:inset(0 100% 0 0);transition:none}
.holding .prog{clip-path:inset(0 0 0 0);transition:clip-path 1.4s linear}
.door .txt{flex:1;min-width:0}
.door .txt b{font-size:.98rem;font-weight:600;display:block}
.door .txt .sub{font-size:.76rem}

/* Energy */
.energy .row{display:flex;align-items:flex-end;justify-content:space-between}
.phases{display:flex;gap:.5rem;margin-top:.4rem}
.phase{flex:1;font-size:.78rem;color:var(--muted)}
.phase i{display:block;height:.3rem;border-radius:99px;background:#262c37;margin-top:.25rem;overflow:hidden}
.phase i b{display:block;height:100%;background:var(--blue);border-radius:99px}

/* Kalender */
.cal{display:flex;flex-direction:column}
.cal-list{flex:1;min-height:0;overflow:auto}
.cday{display:grid;grid-template-columns:4.7rem 1fr;gap:.5rem;padding:.38rem 0;border-bottom:1px solid var(--line)}
.cday:last-child{border:0}
.cday h3{font-size:.75rem;font-weight:600;color:var(--muted);padding-top:.12rem;white-space:nowrap}
.cday.today h3{color:var(--blue)}
.cev{display:flex;gap:.55rem;font-size:.88rem;line-height:1.3;padding:.05rem 0}
.cev .ct{flex:none;width:5.5rem;white-space:nowrap;color:var(--muted);font-size:.78rem;padding-top:.1rem;font-variant-numeric:tabular-nums}
.cal{flex:0 1 auto}
.cev .cs{flex:1;min-width:0;overflow-wrap:anywhere}
.cempty{font-size:.78rem;color:#5b6475;padding-top:.1rem}
.seg-days{display:flex;flex-wrap:wrap;gap:.35rem}
.seg-days button{padding:.45rem .75rem;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.85rem}
.seg-days button.on{background:var(--blue);border-color:var(--blue);color:#06172b}
.tm-row{display:flex;gap:.5rem;align-items:center}
.tm-row input{flex:1}

/* Appliances */
.apps{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.5rem;padding-top:.45rem;border-top:1px solid var(--line)}
.app-row{display:flex;align-items:center;gap:.45rem;min-width:0}
.app-row .ai{width:1.6rem;height:1.6rem;border-radius:.5rem;display:grid;place-items:center;background:var(--card2);color:var(--muted);flex:none}
.app-row .ai svg{width:.95rem;height:.95rem}
.app-row .an{flex:1;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-row .as{font-size:.75rem;color:var(--muted);white-space:nowrap}
.app-row.run .ai{background:#13304a;color:var(--blue)}
.app-row.run .as{color:var(--blue)}
.app-row.done .as{color:var(--good)}
.pbar{height:.25rem;border-radius:99px;background:#262c37;margin-top:.3rem;overflow:hidden}
.pbar b{display:block;height:100%;background:var(--blue)}

/* Sophämtning */
.w-row{display:flex;align-items:center;gap:.55rem;padding:.32rem 0;border-bottom:1px solid var(--line);font-size:.85rem}
.w-row:last-child{border:0}
.w-dot{width:.6rem;height:.6rem;border-radius:50%;flex:none}
.w-d{width:5.2rem;flex:none;color:var(--muted);font-size:.78rem}
.w-f{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-c{font-size:.75rem;color:var(--muted);white-space:nowrap}
.w-row.next .w-f{font-weight:600}
.w-row.soon .w-c{color:var(--warn);font-weight:600}

/* Prognos */
.fc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.fc-day{background:var(--card2);border:1px solid var(--line);border-radius:.7rem;padding:.4rem .3rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.fc-l{font-size:.72rem;color:var(--muted);font-weight:600}
.fc-i svg{width:1.6rem;height:1.6rem;color:var(--blue);stroke-width:1.5}
.fc-t b{font-size:1.05rem;font-weight:500;margin-right:.3rem}
.fc-t span{font-size:.8rem;color:var(--muted)}
.fc-x{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.2rem}
.fc-x svg{width:.75rem;height:.75rem}

/* Spotpris */
.price{display:flex;flex-direction:column}
.price-top{display:flex;align-items:center;gap:.8rem;margin-bottom:.3rem}
.price-now{flex:1}
.lvl{display:inline-block;margin-left:.45rem;padding:.15rem .5rem;border-radius:99px;font-size:.7rem;font-weight:600;vertical-align:middle;letter-spacing:0}
.lvl.low{background:#123a2a;color:var(--good)} .lvl.mid{background:#3a2c14;color:var(--warm)} .lvl.high{background:#3a1a1e;color:var(--bad)}
.pstat{display:flex;flex-direction:column;gap:.05rem;font-size:.72rem;color:var(--muted);padding-left:.8rem;border-left:1px solid var(--line)}
.pstat b{font-size:1rem;font-weight:600}
.pstat.lo b{color:var(--good)} .pstat.hi b{color:var(--bad)}
#pchart{height:9.5rem;position:relative}
#pchart svg{position:absolute;inset:0;width:100%;height:100%;stroke:none;fill:initial}
#pchart text{font-size:11px;fill:var(--muted);font-family:inherit}
.pnote{font-size:.68rem;color:var(--faint);margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Sheet + dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:10}
.scrim.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:1.4rem;padding:1.5rem;width:min(30rem,90vw)}
.sheet h3{font-family:var(--disp);font-size:1.05rem;font-weight:400;margin-bottom:.3rem}
.dim{-webkit-appearance:none;appearance:none;width:100%;height:4rem;border-radius:1rem;background:linear-gradient(90deg,#3a2c14,var(--warm));margin:1.2rem 0;outline:none}
.dim::-webkit-slider-thumb{-webkit-appearance:none;width:1.2rem;height:4.4rem;border-radius:.5rem;background:#fff;box-shadow:0 0 .6rem rgba(0,0,0,.5)}
.field{display:flex;flex-direction:column;gap:.3rem;margin:.8rem 0}
.field label{font-size:.8rem;color:var(--muted)}
.field input{font:inherit;padding:.7rem .8rem;border-radius:.7rem;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.sheet .acts{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.toast{position:fixed;left:50%;bottom:1.2rem;opacity:0;pointer-events:none;transform:translateX(-50%) translateY(150%);background:#2a303b;padding:.7rem 1.1rem;border-radius:99px;font-size:.9rem;transition:transform .3s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:900px),(orientation:portrait){
  body{overflow:auto;height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr 1fr}
  .col-mid{grid-column:1/-1;order:-1}
  html{font-size:clamp(13px,2vw,18px)}
}
@media (max-width:560px){
  main{grid-template-columns:1fr}
  .light-grid{grid-template-columns:1fr 1fr}
  .clock{font-size:2.6rem}
  .alerts{display:none}
}
/* === Mjuk + gradient (bygger på nuvarande) === */
:root{--r:1.3rem;--line:rgba(255,255,255,.06)}
body{background:
 radial-gradient(ellipse at 0% 0%,#1c2b47 0%,transparent 58%),
 radial-gradient(ellipse at 100% 100%,#1a1d33 0%,transparent 50%),
 linear-gradient(160deg,#10141c 0%,#0c0f15 100%)}
.card{background:linear-gradient(160deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.02) 100%),#151922;
 border:1px solid rgba(255,255,255,.05);
 box-shadow:0 .5rem 1.5rem rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05)}
.weather{background:linear-gradient(160deg,#22304a 0%,#18202e 55%,#151922 100%)}
.car{background:linear-gradient(160deg,#1c2c48 0%,#172031 55%,#151922 100%)}
.tile,.fc-day{border-radius:1rem;border-color:transparent;background:linear-gradient(160deg,#2a303c,#222731);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tile.on{background:linear-gradient(150deg,#4a3518 0%,#33271a 60%,#261f18 100%);border-color:transparent;
 box-shadow:0 0 1.2rem rgba(246,184,75,.14)}
.tile .bar{border-radius:0 3px 3px 0}
.btn,.chip{border-radius:99px;border-color:transparent;background:linear-gradient(160deg,#232833,#1c2029)}
.iconbtn{border-color:transparent;background:linear-gradient(160deg,#232833,#1c2029)}
.chip.warn{background:linear-gradient(160deg,#2e2516,#221c12);border-color:transparent}
.chip.bad{border-color:transparent}
.btn.active{background:linear-gradient(160deg,#16443a,#11332a);border-color:transparent}
.lockbtn{border-radius:.9rem}
.cday,.w-row,.indoor,.apps,.pstat{border-color:rgba(255,255,255,.05)}
.phase i,.pbar{background:rgba(255,255,255,.07)}
.phase i b,.pbar b{background:linear-gradient(90deg,#3d7fd6,#5aa9ff)}
#pchart rect[fill="#2a303b"]{fill:#262b36}
</style>
</head>

/* ===================== Motor ===================== */
var LS = 'hallDash.v1';
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){ return {}; } }
function saveLocal(o){ try{ localStorage.setItem(LS, JSON.stringify(o)); }catch(e){} }
var local = loadLocal();
var cfg = { address: local.address || CONFIG.address, token: local.token || CONFIG.token };
var DEMO = !(cfg.address && cfg.token);
var state = JSON.parse(JSON.stringify(SNAPSHOT));
var pending = {};          // undviker flimmer direkt efter ett klick
var powerHist = [];
var holding = false;
var pollBusy = false, pollFails = 0;   // ingen dubbelpollning, felmeddelande först efter 3 missar i rad
var D = CONFIG.dev;

function $(id){ return document.getElementById(id); }
function v(id, cap){ var s = state[id]; return s ? s[cap] : undefined; }
function num(n, d){ if(n==null||isNaN(n)) return '–'; return Number(n).toLocaleString('sv-SE',{maximumFractionDigits:d==null?1:d, minimumFractionDigits:0}); }
function icon(n){ return '<svg><use href="#i-'+n+'"/></svg>'; }
function toast(t){ var e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){e.classList.remove('show');},2200); }

function api(method, path, body, signal){
  var base = cfg.address.replace(/\/+$/,'');
  return fetch(base + '/api' + path, {
    method: method,
    headers: {'Authorization':'Bearer '+cfg.token, 'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined,
    signal: signal
  }).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.status===204 ? null : r.json();
  });
}

function setConn(kind, txt){
  $('dot').className = 'status ' + kind;
  $('connTxt').textContent = txt;
}

function poll(){
  if(DEMO){
    var p = v(D.pulse,'measure_power') || 800;
    state[D.pulse].measure_power = Math.max(250, Math.round(p + (843-p)*.15 + (Math.random()-.5)*140));
    pushPower(); render(); return;
  }
  if(pollBusy) return; pollBusy = true;
  var ctl = window.AbortController ? new AbortController() : null, tmo = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
  api('GET','/manager/devices/device/', null, ctl && ctl.signal).then(function(devs){
    pollBusy = false; clearTimeout(tmo); pollFails = 0;
    var now = Date.now();
    Object.keys(devs).forEach(function(id){
      var caps = devs[id].capabilitiesObj || {};
      var s = state[id] || (state[id] = {});
      Object.keys(caps).forEach(function(c){
        if(pending[id+'|'+c] && now - pending[id+'|'+c] < 4000) return;
        s[c] = caps[c].value; if(caps[c].lastUpdated) s['_lu_'+c] = caps[c].lastUpdated;
      });
    });
    setConn('ok','Ansluten');
    pushPower(); render();
  }).catch(function(e){
    pollBusy = false; clearTimeout(tmo); pollFails++;
    if(pollFails >= 3) setConn('err', 'Ingen kontakt (' + (e.name==='AbortError' ? 'timeout' : (e.message||'fel')) + ')');
  });
}

function setCap(id, cap, value){
  (state[id] || (state[id] = {}))[cap] = value;
  pending[id+'|'+cap] = Date.now();
  render();
  if(DEMO) return Promise.resolve();
  return api('PUT','/manager/devices/device/'+id+'/capability/'+cap, {value:value})
    .catch(function(e){ toast('Kunde inte styra enheten ('+e.message+')'); });
}

function pushPower(){
  var p = v(D.pulse,'measure_power');
  if(p==null) return;
  powerHist.push(p);
  if(powerHist.length > 360) powerHist.shift();   // ~30 min vid 5 s
}

var MON = {Jan:'jan',Feb:'feb',Mar:'mar',Apr:'apr',May:'maj',Jun:'jun',Jul:'jul',Aug:'aug',Sep:'sep',Oct:'okt',Nov:'nov',Dec:'dec'};
function ageMin(s){
  var m = /^([A-Z][a-z]{2}) (\d+) (\d+):(\d+)/.exec(String(s||'')); if(!m) return null;
  var mi = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(m[1]); if(mi<0) return null;
  var now = new Date(), d = new Date(now.getFullYear(), mi, +m[2], +m[3], +m[4]);
  if(d - now > 86400000) d.setFullYear(d.getFullYear()-1);
  return Math.max(0, Math.round((now - d)/60000));
}
function agoTxt(min){ return min==null ? '' : min < 1 ? 'nyss' : min < 60 ? min+' min sedan' : min < 1440 ? Math.round(min/60)+' h sedan' : Math.round(min/1440)+' d sedan'; }
function fmtTs(t, am){ var d = new Date(t), hm = ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); return am<1200 ? hm : d.getDate()+' '+['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()]+' '+hm; }

function lightInfo(L){
  var on = 0, dimSum = 0, dimN = 0;
  L.ids.forEach(function(id){
    if(v(id,'onoff')){ on++; var d=v(id,'dim'); if(d!=null){ dimSum+=d; dimN++; } }
  });
  return {on:on, total:L.ids.length, dim: dimN ? Math.round(dimSum/dimN*100) : null};
}

/* ===================== Sophämtning ===================== */
function wasteNext(n){
  var W = CONFIG.waste, p = W.start.split('-'), s = new Date(+p[0], +p[1]-1, +p[2]);
  var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  var diff = Math.round((t - s)/86400000), k = diff <= 0 ? 0 : Math.ceil(diff / W.days), out = [];
  for(var idx=k; out.length<n; idx++){
    var d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + idx*W.days), mv = (W.moves||{})[ymd(d)];
    if(mv){ var q = mv.split('-'); d = new Date(+q[0], +q[1]-1, +q[2]); }
    var dd = Math.round((d - t)/86400000); if(dd < 0) continue;   // flyttad tömning som redan passerat
    out.push({d:d, days:dd, f:W.cycle[((idx % W.cycle.length) + W.cycle.length) % W.cycle.length]});
  }
  return out;
}
function wasteWhen(n){ return n===0 ? 'idag' : n===1 ? 'imorgon' : 'om '+n+' d'; }
function renderWaste(){
  var el = $('waste'); if(!el) return;
  var L = wasteNext(3);
  el.innerHTML = '<div class="head"><h2>'+icon('trash')+'Sophämtning</h2></div>' +
    L.map(function(x,i){
      var dl = x.d.toLocaleDateString('sv-SE',{weekday:'short', day:'numeric', month:'numeric'}).replace(/^./,function(c){return c.toUpperCase();});
      return '<div class="w-row'+(i===0?' next':'')+(x.days<=1?' soon':'')+'"><span class="w-dot" style="background:'+x.f.col+'"></span>'+
        '<span class="w-d">'+dl+'</span><span class="w-f">'+x.f.name+'</span><span class="w-c">'+wasteWhen(x.days)+'</span></div>';
    }).join('');
}

/* ===================== Väderprognos 5 dygn (SMHI SNOW1g, öppna data) ===================== */
var fc = null, fcErr = '';
function wxIcon(c){ c=+c; return c<=2?'sun':c<=4?'partly':c<=6?'cloud':c===7?'fog':(c===11||c===21)?'thunder':(c>=12&&c<=14)||(c>=22&&c<=24)?'sleet':(c>=15&&c<=17)||c>=25?'snow':'rain'; }
var WXTXT = {1:'Klart',2:'Mest klart',3:'Växlande moln',4:'Halvklart',5:'Molnigt',6:'Mulet',7:'Dimma',8:'Lätta regnskurar',9:'Regnskurar',10:'Kraftiga regnskurar',11:'Åska',12:'Lätta byar av snöblandat regn',13:'Snöblandade byar',14:'Kraftiga snöblandade byar',15:'Lätta snöbyar',16:'Snöbyar',17:'Kraftiga snöbyar',18:'Lätt regn',19:'Regn',20:'Kraftigt regn',21:'Åska',22:'Lätt snöblandat regn',23:'Snöblandat regn',24:'Kraftigt snöblandat regn',25:'Lätt snöfall',26:'Snöfall',27:'Kraftigt snöfall'};
function loadFc(){
  var u = 'https://opendata-download-metfcst.smhi.se/api/category/snow1g/version/1/geotype/point/lon/'+CONFIG.fcLon.toFixed(6)+'/lat/'+CONFIG.fcLat.toFixed(6)+'/data.json';
  fetch(u).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(j){
    var days = {}, order = [];
    (j.timeSeries||[]).forEach(function(x){
      var t = new Date(x.time), k = ymd(t), d = x.data||{}, h = t.getHours();
      if(!days[k]){ days[k] = {k:k, d:t, tmin:99, tmax:-99, wmax:0, pop:0, sym:null, symDist:99}; order.push(k); }
      var o = days[k];
      if(d.air_temperature!=null && d.air_temperature!==9999){ o.tmin=Math.min(o.tmin,d.air_temperature); o.tmax=Math.max(o.tmax,d.air_temperature); }
      if(d.wind_speed!=null && d.wind_speed!==9999) o.wmax=Math.max(o.wmax,d.wind_speed);
      if(d.probability_of_precipitation!=null && d.probability_of_precipitation!==9999) o.pop=Math.max(o.pop,d.probability_of_precipitation);
      var dist = Math.abs(h-13); if(d.symbol_code && d.symbol_code!==9999 && dist<o.symDist){ o.sym=d.symbol_code; o.symDist=dist; }
    });
    var st = (order[0]===ymd(new Date()) && new Date().getHours()>=15) ? 1 : 0;   // efter kl 15 börjar prognosen på imorgon
    fc = order.slice(st, st+3).map(function(k){ return days[k]; }); fcErr = ''; renderFc();
  }).catch(function(e){ fcErr = e.message; renderFc(); });
}
function renderFc(){
  var el = $('fc'); if(!el) return;
  var head = '<div class="head"><h2>'+icon('sun')+'Prognos 3 dygn</h2></div>';
  if(!fc){ el.innerHTML = head + '<div class="sub">'+(fcErr ? 'Kunde inte hämta prognosen ('+esc(fcErr)+')' : 'Hämtar prognos…')+'</div>'; return; }
  el.innerHTML = head + '<div class="fc-row">' + fc.map(function(o,i){
    var dd = Math.round((new Date(o.d.getFullYear(),o.d.getMonth(),o.d.getDate()) - new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/86400000);
    var lbl = dd===0 ? 'Idag' : dd===1 ? 'Imorgon' : o.d.toLocaleDateString('sv-SE',{weekday:'short'}).replace(/^./,function(c){return c.toUpperCase();});
    return '<div class="fc-day" title="'+(WXTXT[o.sym]||'')+'"><div class="fc-l">'+lbl+'</div><div class="fc-i">'+icon(wxIcon(o.sym))+'</div>'+
      '<div class="fc-t"><b>'+num(Math.round(o.tmax)||0,0)+'°</b><span>'+num(Math.round(o.tmin)||0,0)+'°</span></div>'+
      '<div class="fc-x">'+(o.pop>=20 ? icon('drop')+num(o.pop,0)+' %' : icon('wind')+num(o.wmax,0)+' m/s')+'</div></div>';
  }).join('') + '</div>';
}

function loadCal(){

function saveCal(){
  var s = $('calS').value.trim(); if(!s){ toast('Skriv vad som ska hända'); return; }
  var req = {s:s, d:calSel, t:$('calT').value||'', id:Date.now()};
  $('calScrim').classList.remove('show');
  if(!cal) cal = {ev:[]};
  cal.ev = (cal.ev||[]).concat([{d:req.d, s:s, a:req.t?0:1, t:req.t, e:''}]); renderCal();
  if(DEMO){ toast('Demoläge – sparas inte'); return; }
  var val = JSON.stringify(req), path = '/manager/logic/variable/'+CONFIG.calNewVar;
  function ok(x){ return x && (x.value===val || x.value==='-'+req.id); }
  api('PUT', path, {value:val}).catch(function(){ return null; })
    .then(function(){ return api('GET', path); })
    .then(function(x){ if(ok(x)) return x; return api('PUT', path, {variable:{value:val}}).then(function(){ return api('GET', path); }); })
    .then(function(x){ if(!ok(x)) throw new Error('kunde inte skriva till Homey'); toast('Sparat – syns i telefonerna om en stund'); setTimeout(loadCal, 15000); })
    .catch(function(e){ toast('Kunde inte spara ('+e.message+')'); });
}

  var el = $('cal'); if(!el) return;
  var head = '<div class="head"><h2>'+icon('calendar')+'Veckans kalender</h2>'+'<span style="display:flex;align-items:center;gap:.6rem">'+(cal && cal.u && cal.u!=='demo' ? '<span class="sub" style="font-size:.7rem">uppd. '+cal.u+'</span>' : '')+'<button class="btn" data-act="caladd">+ Lägg till</button></span></div>';

  for(var i=0;i<7;i++){
    var d = new Date(t.getFullYear(), t.getMonth(), t.getDate()+i), k = ymd(d);
    var lbl = i===0 ? 'Idag' : i===1 ? 'Imorgon' : d.toLocaleDateString('sv-SE',{weekday:'short', day:'numeric', month:'numeric'}).replace(/^./, function(c){ return c.toUpperCase(); });

  el.innerHTML = head + '<div class="cal-list">'+h+'</div>';

var prices = {};
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function loadDay(d){
  var k = ymd(d);
  var url = 'https://www.elprisetjustnu.se/api/v1/prices/'+d.getFullYear()+'/'+k.slice(5)+'_'+CONFIG.priceArea+'.json';
  return fetch(url).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(a){
    prices[k] = a.map(function(x){ return {t:new Date(x.time_start).getTime(), p:x.SEK_per_kWh*100*(CONFIG.priceVat?1.25:1)}; });
    try{ localStorage.setItem('hallDash.prices', JSON.stringify(prices)); }catch(e){}
  });
}
function loadPrices(){
  var t = new Date(), m = new Date(t.getFullYear(), t.getMonth(), t.getDate()+1);
  var keep = {}; keep[ymd(t)] = 1; keep[ymd(m)] = 1;
  if(!Object.keys(prices).length){ try{ prices = JSON.parse(localStorage.getItem('hallDash.prices')||'{}'); }catch(e){} }
  Object.keys(prices).forEach(function(k){ if(!keep[k]) delete prices[k]; });
  var jobs = [];
  if(!prices[ymd(t)]) jobs.push(loadDay(t).catch(function(){}));
  if(!prices[ymd(m)]) jobs.push(loadDay(m).catch(function(){}));
  Promise.all(jobs).then(function(){
    if(!prices[ymd(t)] && DEMO){
      var s0 = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      prices[ymd(t)] = PRICE_DEMO.map(function(p,i){ return {t:s0+i*900000, p:p}; });
    }
    renderPrice();
  });
}
function hourly(){
  var h = {};
  Object.keys(prices).forEach(function(k){ prices[k].forEach(function(x){
    var d = new Date(x.t); d.setMinutes(0,0,0); var key = d.getTime();
    (h[key] || (h[key] = [])).push(tot(x.p));
  }); });
  return Object.keys(h).map(Number).sort(function(a,b){ return a-b; }).map(function(k){
    var a = h[k]; return {t:k, p:a.reduce(function(s,x){ return s+x; },0)/a.length};
  });
}
function tot(spot){ var T = CONFIG.tariff; return (Math.min(spot, T.cap) + T.handel + T.nat) * T.vat; }
function ore(p){ return num(p, Math.abs(p)<10?1:0); }
function hh(t){ return ('0'+new Date(t).getHours()).slice(-2); }
function span(t){
  var d = new Date(t), today = ymd(new Date());
  return (ymd(d)===today ? '' : 'imorgon ') + 'kl '+hh(t)+'–'+hh(t+3600000);
}
function renderPrice(){
  var el = $('price'); if(!el) return;
  var head = '<div class="head" style="margin-bottom:.5rem"><h2>'+icon('bolt')+'Elpris '+CONFIG.priceArea+'</h2><span class="sub">öre/kWh · totalpris inkl. nät, skatt & moms · takpris '+CONFIG.tariff.cap+' öre</span></div>';
  var H = hourly(), now = Date.now();
  if(!H.length){ el.innerHTML = head + '<div class="sub">Hämtar elpriser…</div>'; return; }
  var cur = null;
  Object.keys(prices).forEach(function(k){ prices[k].forEach(function(x){ if(x.t<=now && now<x.t+900000) cur = tot(x.p); }); });
  var hs = new Date(); hs.setMinutes(0,0,0); hs = hs.getTime();
  var fut = H.filter(function(x){ return x.t>=hs; });
  if(!fut.length) fut = H;
  var sorted = fut.map(function(x){ return x.p; }).sort(function(a,b){ return a-b; });
  var q1 = sorted[Math.floor((sorted.length-1)/3)], q2 = sorted[Math.floor((sorted.length-1)*2/3)];
  function lvl(p){ return p<=q1 ? 'low' : p<=q2 ? 'mid' : 'high'; }
  var mn = fut[0], mx = fut[0];
  fut.forEach(function(x){ if(x.p<mn.p) mn = x; if(x.p>mx.p) mx = x; });
  if(cur==null) cur = fut[0].p;
  var L = lvl(cur), LT = {low:'Billigt', mid:'Normalt', high:'Dyrt'}[L];
  var hasTomorrow = !!prices[ymd(new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()+1))];
  el.innerHTML = head +
    '<div class="price-top">'+
      '<div class="price-now"><span class="big">'+ore(cur)+'</span><span class="unit">öre</span><span class="lvl '+L+'">'+LT+' just nu</span></div>'+
      '<div class="pstat lo">Lägst '+span(mn.t)+'<b>'+ore(mn.p)+' öre</b></div>'+
      '<div class="pstat hi">Högst '+span(mx.t)+'<b>'+ore(mx.p)+' öre</b></div>'+
    '</div>'+
    '<div id="pchart"></div>'+
    '<div class="pnote">Grönt billigast · gult normalt · rött dyrast av kommande timmar'+(hasTomorrow ? '' : ' · morgondagens priser ca kl 13')+'</div>';
  drawChart(hasTomorrow ? H.filter(function(x){ return x.t >= hs-2*3600000; }) : H, hs, mn, mx, lvl);
}
function drawChart(H, hs, mn, mx, lvl){
  var box = $('pchart'); var W = box.clientWidth, Hh = box.clientHeight;
  if(!W || !Hh) return;
  var top = 16, bot = 16, ch = Hh-top-bot, n = H.length, bw = W/n, g = Math.max(1, bw*.18);
  var capP = tot(CONFIG.tariff.cap);
  var maxP = capP; H.forEach(function(x){ if(x.p>maxP) maxP = x.p; }); maxP *= 1.08;
  var col = {low:'#3ecf8e', mid:'#f6b84b', high:'#ff6b6b'};
  var s = '<svg viewBox="0 0 '+W+' '+Hh+'" width="'+W+'" height="'+Hh+'">';
  H.forEach(function(x,i){
    var bh = Math.max(2, Math.max(0,x.p)/maxP*ch), xx = i*bw+g/2, yy = top+ch-bh, past = x.t<hs, isCur = x.t===hs;
    var f = past ? '#2a303b' : col[lvl(x.p)];
    s += '<rect x="'+xx.toFixed(1)+'" y="'+yy.toFixed(1)+'" width="'+(bw-g).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="'+f+'" fill-opacity="'+(past?1:(isCur?1:.75))+'"'+(isCur?' stroke="#fff" stroke-width="1.5"':'')+'/>';
    var hr = new Date(x.t).getHours();
    if(hr===0 && i>0){
      s += '<line x1="'+(i*bw).toFixed(1)+'" y1="4" x2="'+(i*bw).toFixed(1)+'" y2="'+(top+ch)+'" stroke="#5b6475" stroke-dasharray="3 3"/>';
      s += '<text x="'+(i*bw+4).toFixed(1)+'" y="11">imorgon</text>';
    }
    if(isCur) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(Hh-3)+'" text-anchor="middle" style="fill:#eef1f6;font-weight:600">nu</text>';
    else if(hr%3===0) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(Hh-3)+'" text-anchor="middle">'+('0'+hr).slice(-2)+'</text>';
    if(x===mn || x===mx) s += '<text x="'+(xx+(bw-g)/2).toFixed(1)+'" y="'+(yy-4).toFixed(1)+'" text-anchor="middle" style="fill:'+(x===mn?'#3ecf8e':'#ff6b6b')+';font-weight:600">'+ore(x.p)+'</text>';
  });
  var cy = (top+ch-capP/maxP*ch).toFixed(1);
  s += '<line x1="0" y1="'+cy+'" x2="'+W+'" y2="'+cy+'" stroke="#eef1f6" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="6 4"/>';
  s += '<text x="'+(W-2)+'" y="'+(cy-5)+'" text-anchor="end" style="fill:#eef1f6;opacity:.75">Takpris ('+CONFIG.tariff.cap+' öre spot) = '+ore(capP)+' öre</text>';
  box.innerHTML = s + '</svg>';
}

function syncDim(){
  var inf = lightInfo(CONFIG.lights[dimIdx]);
  var d = inf.dim!=null ? inf.dim : Math.round((v(CONFIG.lights[dimIdx].ids[0],'dim')||1)*100);
  if(document.activeElement !== $('dimRange')) $('dimRange').value = d;
  $('dimVal').textContent = inf.on ? d+' %' : 'Släckt';
}
$('dimRange').addEventListener('input', function(){ $('dimVal').textContent = this.value+' %'; });
$('dimRange').addEventListener('change', function(){
  var val = this.value/100;
  CONFIG.lights[dimIdx].ids.forEach(function(id){ setCap(id,'dim',val); if(!v(id,'onoff')) setCap(id,'onoff',true); });
});

document.addEventListener('pointerdown', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  longFired = false;
  if(t.dataset.act==='light'){
    pressTimer = setTimeout(function(){ longFired = true; openDim(+t.dataset.i); }, 550);
  }
  if(t.dataset.act==='lock' && v(D.door,'locked')){
    holding = true; t.parentNode.classList.add('holding');
    unlockTimer = setTimeout(function(){
      longFired = true; holding = false;
      setCap(D.door,'locked',false); toast('Ytterdörren låses upp');
    }, 1400);
  }
});
function cancelPress(){
  clearTimeout(pressTimer);
  if(unlockTimer){ clearTimeout(unlockTimer); unlockTimer=null; }
  if(holding){ holding=false; $('door').classList.remove('holding'); renderDoor(); }
}
document.addEventListener('pointerup', cancelPress);
document.addEventListener('pointercancel', cancelPress);
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if(!t) return;
  if(longFired){ longFired=false; return; }
  var act = t.dataset.act;
  switch(act){
    case 'light': toggleLight(+t.dataset.i); break;
    case 'alloff':
      CONFIG.lights.forEach(function(L){ L.ids.forEach(function(id){ if(v(id,'onoff')) setCap(id,'onoff',false); }); });
      toast('Alla lampor släcks'); break;
    case 'climate': var c = !v(D.car,'climate_control'); setCap(D.car,'climate_control',c); toast(c?'Förvärmning startas':'Förvärmning stoppas'); break;
    case 'carlock': if(v(D.car,'locked')===false){ setCap(D.car,'locked',true); toast('Bilen låses'); } break;
    case 'force': setCap(D.force,'onoff',!v(D.force,'onoff')); break;
    case 'lock': if(!v(D.door,'locked')){ setCap(D.door,'locked',true); toast('Ytterdörren låses'); } else toast('Håll in för att låsa upp'); break;
    case 'dimoff': CONFIG.lights[dimIdx].ids.forEach(function(id){ setCap(id,'onoff',false); }); closeDim(); break;
    case 'caladd': openCalAdd(); break;
    case 'calday': calSel = t.dataset.d; renderCalDays(); break;
    case 'calnotime': $('calT').value = ''; break;
    case 'calclose': $('calScrim').classList.remove('show'); break;
    case 'calsave': saveCal(); break;
    case 'dimclose': closeDim(); break;
    case 'setclose': $('setScrim').classList.remove('show'); break;
    case 'setsave':
      saveLocal({address:$('fAddr').value.trim(), token:$('fTok').value.trim()}); location.reload(); break;
    case 'setdemo': saveLocal({}); location.reload(); break;
  }
});
function closeDim(){ $('dimScrim').classList.remove('show'); dimIdx = null; }
$('dimScrim').addEventListener('click', function(e){ if(e.target===this) closeDim(); });
$('gear').addEventListener('click', function(){
  $('fAddr').value = cfg.address; $('fTok').value = cfg.token;
  $('setScrim').classList.add('show');
});

/* ===================== Start ===================== */
if(DEMO){ setConn('demo','Demoläge'); for(var k=0;k<40;k++){ poll(); } }
else setConn('', 'Ansluter…');
renderClock(); setInterval(renderClock, 10000);
render(); poll(); setInterval(poll, CONFIG.pollMs);
loadPrices(); setInterval(loadPrices, 15*60*1000);
loadCal(); setInterval(loadCal, 60*1000);
loadFc(); setInterval(loadFc, 30*60*1000);

/* Automatisk uppdatering: om sidan laddats via start.html kollas GitHub var 10:e minut */
(function(){
  var src=null, cur=null;
  try{ src=localStorage.getItem('hallDash.src'); cur=localStorage.getItem('hallDash.cache'); }catch(e){}
  if(!src) return;
  setInterval(function(){
    fetch(src+'?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(h){ if(cur && h!==cur && h.indexOf('</html>')>0){ try{localStorage.setItem('hallDash.cache',h);}catch(e){} location.reload(); } })
      .catch(function(){});
  }, 10*60*1000);
})();
